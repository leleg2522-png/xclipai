<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Portal developer Xclip. Kelola API key, dokumentasi integrasi, dan akses akun.">
    <title>Xclip — Portal Developer</title>
    <link rel="icon" href="/assets/icon-192.png">
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/styles/developer.css?v=2">
    <style>body{margin:0}button:disabled{opacity:.55;cursor:wait}textarea,select{font:inherit;max-width:100%}.xp-data-note{padding:12px;border:1px solid var(--xp-line);border-radius:8px;margin-top:15px;font-size:12px}.xp-payment-form{display:grid;gap:14px;padding:24px}.xp-payment-form input,.xp-payment-form select{padding:12px;border:1px solid var(--xp-line);border-radius:5px;background:white}.xp-history{width:100%;border-collapse:collapse}.xp-history th,.xp-history td{padding:12px;text-align:left;border-bottom:1px solid var(--xp-line);font-size:12px}.xp-qris{width:min(260px,100%);height:auto}.xp-payment-form button{padding:12px;background:var(--xp-green);color:white;border:0;border-radius:5px}.xp-alert{position:sticky;top:0;z-index:20;padding:14px 24px;background:#fff4e8;color:#693c19;border-bottom:1px solid #eddbc1}.xp-key-value-row code{overflow-wrap:anywhere;word-break:break-all}.xp-login-input-wrap{overflow:hidden}</style>
  </head>
  <body>
    <div id="developer-app" class="xp-portal"><main class="xp-main" aria-live="polite">Memeriksa sesi akun…</main></div>
    <script type="module" src="/src/developer.js?v=3"></script>
  </body>
